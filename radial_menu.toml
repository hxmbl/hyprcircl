inner_radius = 30.0
outer_radius = 100.0
ring_thickness = 60.0
ring_gap = 8.0
item_gap_degrees = 0.0
corner_radius = 8.0
notify_only = false

[top_bar]
enabled = true
height = 28.0
padding_x = 14.0
offset_y = 24.0
corner_radius = 14.0
background = [0.15, 0.15, 0.2, 0.9]
foreground = [0.9, 0.9, 0.95, 1.0]
font = "JetBrainsMono Nerd Font"

# Waybar-style modules (mirrors ~/.config/waybar/config.jsonc)
# Push mode: subscribes to the Hyprland event socket — zero polling, instant
# workspace switches. `interval` is ignored while `stream_command` is set.
[[top_bar.modules]]
stream_command = "S=${HYPRLAND_INSTANCE_SIGNATURE:-$(hyprctl -j instances | jq -r '.[0].instance')}; hyprctl activeworkspace -j | jq -r '.id'; nc -U \"$XDG_RUNTIME_DIR/hypr/$S/.socket2.sock\" | while read -r line; do case \"$line\" in workspace\\>\\>*) echo \"${line#workspace>>}\";; workspacev2\\>\\>*) echo \"${line#workspacev2>>}\" | cut -d, -f1;; focusedmon\\>\\>*) echo \"${line#focusedmon>>}\" | cut -d, -f2;; esac; done"
interval = 1
format = "{output}"
icon = ""

[[top_bar.modules]]
command = "date +'%a %H:%M'"
interval = 30
format = "{output}"
icon = ""
on_click_right = "omarchy-launch-floating-terminal-with-presentation omarchy-tz-select"

[[top_bar.modules]]
command = "\"$OMARCHY_PATH/default/waybar/weather.sh\" | jq -r '.text'"
interval = 60
format = "{output}"
icon = ""
on_click = "notify-send -u low \"$(omarchy-weather-status)\""

[[top_bar.modules]]
command = "omarchy-update-available"
interval = 21600
format = ""
icon = ""
on_click = "omarchy-launch-floating-terminal-with-presentation omarchy-update"

[[top_bar.modules]]
command = "timeout 2 omarchy-voxtype-status | jq -r '.text'"
interval = 5
format = "{output}"
icon = ""
on_click = "omarchy-voxtype-model"
on_click_right = "omarchy-voxtype-config"

[[top_bar.modules]]
command = "\"$OMARCHY_PATH/default/waybar/indicators/screen-recording.sh\" | jq -r '.text'"
interval = 3
format = "{output}"
icon = ""
on_click = "omarchy-capture-screenrecording"

[[top_bar.modules]]
command = "\"$OMARCHY_PATH/default/waybar/indicators/idle.sh\" | jq -r '.text'"
interval = 3
format = "{output}"
icon = ""
on_click = "omarchy-toggle-idle"

[[top_bar.modules]]
command = "\"$OMARCHY_PATH/default/waybar/indicators/notification-silencing.sh\" | jq -r '.text'"
interval = 3
format = "{output}"
icon = ""
on_click = "omarchy-toggle-notification-silencing"

[[top_bar.modules]]
command = "top -bn2 | awk '/^%Cpu/ {last=100-$8} END {printf \"%.0f%%\\n\", last}'"
interval = 5
format = "󰍛 {output}"
icon = ""
on_click = "omarchy-launch-or-focus-tui btop"
on_click_right = "alacritty"

[[top_bar.modules]]
command = "nmcli -t -f NAME,DEVICE connection show --active | grep -v '^lo:' | head -1 | cut -d: -f1"
interval = 3
format = "󰤨 {output}"
icon = ""
on_click = "omarchy-launch-wifi"
# Re-run instantly when the wireless link goes up/down (SSID roaming still
# lands on the 3s interval fallback).
watch = ["/sys/class/net/wlan0/operstate"]

# Push mode: subscribes to the PulseAudio/PipeWire daemon events — volume
# updates the moment it changes, no 1s pamixer polling.
[[top_bar.modules]]
stream_command = "v=$(pactl get-sink-volume @DEFAULT_SINK@ | grep -oE '[0-9]+%' | head -1 | tr -d %); m=$(pactl get-sink-mute @DEFAULT_SINK@ | awk '{print $2}'); [ \"$m\" = \"yes\" ] && echo muted || echo ${v}%; pactl subscribe | while read -r e; do case \"$e\" in *sink*) v=$(pactl get-sink-volume @DEFAULT_SINK@ | grep -oE '[0-9]+%' | head -1 | tr -d %); m=$(pactl get-sink-mute @DEFAULT_SINK@ | awk '{print $2}'); [ \"$m\" = \"yes\" ] && echo muted || echo ${v}%;; esac; done"
interval = 1
format = " {output}"
icon = ""
on_click = "omarchy-launch-audio"
on_click_right = "pamixer -t"
on_scroll_up = "pamixer -i 5"
on_scroll_down = "pamixer -d 5"

[[top_bar.modules]]
command = "b=$(cat /sys/class/backlight/acpi_video0/actual_brightness 2>/dev/null); m=$(cat /sys/class/backlight/acpi_video0/max_brightness 2>/dev/null); [ -n \"$m\" ] && [ \"$m\" -gt 0 ] && echo $((b * 100 / m))%"
interval = 30
format = "󰃟 {output}"
icon = ""
# Instant brightness changes with no polling cost.
watch = ["/sys/class/backlight/acpi_video0/actual_brightness"]
on_click = "omarchy-brightness-display +5%"
on_click_right = "omarchy-brightness-display 5%-"
on_scroll_up = "omarchy-brightness-display +5%"
on_scroll_down = "omarchy-brightness-display 5%-"

[[top_bar.modules]]
command = "bluetoothctl show 2>/dev/null | grep -q 'Powered: yes' && echo '' || echo ''"
interval = 30
format = "{output}"
icon = ""
on_click = "omarchy-launch-bluetooth"

[[top_bar.modules]]
command = "s=$(cat /sys/class/power_supply/BAT0/status 2>/dev/null); c=$(cat /sys/class/power_supply/BAT0/capacity 2>/dev/null); [ \"$s\" = \"Charging\" ] && echo \"󰂃 $c%\" || echo \"󰁹 $c%\""
interval = 5
format = "{output}"
icon = ""
on_click = "omarchy-menu power"
on_click_right = "notify-send -u low \"$(omarchy-battery-status)\""
# Instant on plug/unplug and capacity changes.
watch = ["/sys/class/power_supply/BAT0/status", "/sys/class/power_supply/BAT0/capacity"]

