name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: Lint (clippy + fmt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Linux layer shell dependencies
        uses: ./.github/actions/setup-linux-layer-shell

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        # `items_after_test_module` and `too_many_arguments` are stylistic lints
        # for pre-existing code; everything else is denied.
        run: cargo clippy --all-targets -- -D warnings -A clippy::items_after_test_module -A clippy::too_many_arguments

  test:
    name: Test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-linux-layer-shell

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install gtk4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --verbose

      - name: Test
        run: cargo test --verbose

  # Continuous green-build versioning: every push to master whose CI fully
  # succeeds gets the next integer tag (v1, v2, ...). A red push gets no number.
  version:
    name: Mint build number
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One mint at a time across the repo, so two green pushes can't take the
    # same number. Never cancel a mint in flight.
    concurrency:
      group: version-mint
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Tag this commit with the next vN
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          if git tag --points-at HEAD | grep -qE '^v[0-9]+$'; then
            echo "already numbered: $(git tag --points-at HEAD | grep -E '^v[0-9]+$')"
            exit 0
          fi
          last="$(git tag --list 'v*' | grep -E '^v[0-9]+$' | sed 's/^v//' | sort -n | tail -n1 || true)"
          last="${last:-0}"
          # A slow run for an older commit must not number it after a newer one.
          if [ "$last" -gt 0 ] && git merge-base --is-ancestor HEAD "v$last"; then
            echo "v$last is already on a newer commit; not numbering this one"
            exit 0
          fi
          next="v$((last + 1))"
          git tag "$next" HEAD
          git push origin "refs/tags/$next"
          echo "::notice::minted $next on ${GITHUB_SHA::7}"
