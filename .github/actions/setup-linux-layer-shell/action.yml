name: Setup Linux layer shell dependencies
description: Install GTK4 and build/install gtk4-layer-shell from source (not packaged in Ubuntu 24.04)

runs:
  using: composite
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libgtk-4-dev \
          libwayland-dev \
          wayland-protocols \
          meson \
          ninja-build \
          pkg-config

    - name: Build and install gtk4-layer-shell
      shell: bash
      run: |
        git clone --depth 1 --branch v1.3.0 https://github.com/wmww/gtk4-layer-shell.git /tmp/gtk4-layer-shell
        cd /tmp/gtk4-layer-shell
        meson setup \
          -Dexamples=false \
          -Ddocs=false \
          -Dtests=false \
          -Dsmoke-tests=false \
          -Dintrospection=false \
          -Dvapi=false \
          build
        ninja -C build
        sudo ninja -C build install
        sudo ldconfig
