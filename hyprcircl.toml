# =============================================================================
# hyprcircl — radial menu + status pill for Hyprland
#
#   bind = $mainMod, Space, exec, hyprcircl      # hyprland.conf
#
# Every key is optional: delete anything you don't care about and the built-in
# value (this file) is used. Edits reload live. Colours, fonts, sizes of text
# and the pill live in hyprcircl.css next to this file.
# Icons are Nerd Font glyphs (https://www.nerdfonts.com/cheat-sheet).
# =============================================================================

schema_version = 2

# -----------------------------------------------------------------------------
# [menu] — ring geometry and behaviour. Sizes are logical pixels (they scale
# with your monitor's scale factor, so 1080p and HiDPI look the same).
# -----------------------------------------------------------------------------
[menu]
inner_radius  = 60      # the empty hole in the middle
outer_radius  = 156     # outer edge of the main ring (ring width = 96)
submenu_width = 76      # width of each submenu ring that opens outside it
ring_gap      = 8       # space between rings
item_gap      = 6       # space between wedges (same width from hole to rim)
animation_ms  = 160     # open/expand animation; 0 turns it off
labels        = true    # text under icons
keyboard      = true    # ←/→ or h/l, 1-9, Enter, Backspace, Esc
notify_only   = false   # true = show a notification instead of running (dry run)

# -----------------------------------------------------------------------------
# [bar] — the status pill above the menu (Waybar-style modules).
#
#   command         shell command; its stdout is the module text
#   interval        seconds between runs (default 5)
#   stream_command  long-running command; each stdout line replaces the text
#   watch           files that trigger an immediate re-run (sysfs works)
#   format          "{output}" is replaced by the text (default "{output}")
#   on_click / on_click_right / on_scroll_up / on_scroll_down
# Modules that print nothing are hidden, so missing hardware just disappears.
# -----------------------------------------------------------------------------
[bar]
enabled = true

# Active workspace, pushed live from Hyprland's event socket (socat or nc -U).
[[bar.modules]]
format = "󰕰 {output}"
stream_command = """
hyprctl activeworkspace | awk 'NR==1 {print $3}'
S="$XDG_RUNTIME_DIR/hypr/$HYPRLAND_INSTANCE_SIGNATURE/.socket2.sock"
{ socat -u "UNIX-CONNECT:$S" - 2>/dev/null || nc -U "$S"; } | while read -r line; do
  case "$line" in 'workspace>>'*) echo "${line#workspace>>}" ;; esac
done
"""

# Clock.
[[bar.modules]]
command = "date +'%a %d %b  %H:%M'"
interval = 10

# Battery: first BAT* found; hidden on desktops.
[[bar.modules]]
command = """
for b in /sys/class/power_supply/BAT*; do
  [ -r "$b/capacity" ] || continue
  [ "$(cat "$b/status")" = Charging ] && i='󰂄' || i='󰁹'
  echo "$i $(cat "$b/capacity")%"; break
done
"""
interval = 30
watch = ["/sys/class/power_supply/BAT0/capacity", "/sys/class/power_supply/BAT0/status"]

# Volume: PipeWire (wpctl), falling back to PulseAudio (pactl).
# Right-click mutes, scroll changes the volume.
[[bar.modules]]
command = """
if command -v wpctl >/dev/null; then
  wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{ if ($3 == "[MUTED]") print "󰖁 muted"; else printf "󰕾 %d%%\n", $2 * 100 + 0.5 }'
else
  v=$(pactl get-sink-volume @DEFAULT_SINK@ | grep -oE '[0-9]+%' | head -1)
  [ "$(pactl get-sink-mute @DEFAULT_SINK@ | awk '{print $2}')" = yes ] && echo "󰖁 muted" || echo "󰕾 $v"
fi
"""
interval = 5
on_click_right = "wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle || pactl set-sink-mute @DEFAULT_SINK@ toggle"
on_scroll_up = "wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+ || pactl set-sink-volume @DEFAULT_SINK@ +5%"
on_scroll_down = "wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- || pactl set-sink-volume @DEFAULT_SINK@ -5%"

# -----------------------------------------------------------------------------
# Menu items, clockwise from the top. [[items.items]] opens a submenu ring.
#
#   command   a string runs through `sh -c` (pipes, $(...), ~ all work);
#             a list like ["playerctl", "next"] is run directly
#   fallback  tried in order when command's program isn't installed
# -----------------------------------------------------------------------------

[[items]]
label = "Terminal"
icon = "󰆍"
command = "$TERMINAL"
fallback = ["ghostty", "kitty", "foot", "alacritty", "wezterm", "konsole", "gnome-terminal"]

[[items]]
label = "Browser"
icon = "󰖟"
command = "$BROWSER"
fallback = ["firefox", "zen-browser", "chromium", "brave", "google-chrome-stable"]

[[items]]
label = "Files"
icon = "󰉋"
command = "nautilus"
fallback = ["thunar", "dolphin", "nemo", "pcmanfm-qt", "xdg-open ~"]

[[items]]
label = "Capture"
icon = "󰄀"

  [[items.items]]
  label = "Region"
  icon = "󰒅"
  command = "hyprshot -m region --clipboard-only"
  fallback = ['grim -g "$(slurp)" - | wl-copy']

  [[items.items]]
  label = "Window"
  icon = "󰖯"
  command = "hyprshot -m window --clipboard-only"
  fallback = ['''grim -g "$(hyprctl -j activewindow | jq -r '"\(.at[0]),\(.at[1]) \(.size[0])x\(.size[1])"')" - | wl-copy''']

  [[items.items]]
  label = "Screen"
  icon = "󰹑"
  command = "hyprshot -m output --clipboard-only"
  fallback = ["grim - | wl-copy"]

  [[items.items]]
  label = "Colour"
  icon = "󰈊"
  command = "hyprpicker -a"

[[items]]
label = "Media"
icon = "󰝚"

  [[items.items]]
  label = "Previous"
  icon = "󰒮"
  command = ["playerctl", "previous"]

  [[items.items]]
  label = "Play"
  icon = "󰐎"
  command = ["playerctl", "play-pause"]

  [[items.items]]
  label = "Next"
  icon = "󰒭"
  command = ["playerctl", "next"]

  [[items.items]]
  label = "Mute"
  icon = "󰝟"
  command = "wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle"
  fallback = ["pactl set-sink-mute @DEFAULT_SINK@ toggle"]

[[items]]
label = "Windows"
icon = "󰖲"

  [[items.items]]
  label = "Float"
  icon = "󰇛"
  command = ["hyprctl", "dispatch", "togglefloating"]

  [[items.items]]
  label = "Fullscreen"
  icon = "󰊓"
  command = ["hyprctl", "dispatch", "fullscreen"]

  [[items.items]]
  label = "Pin"
  icon = "󰐃"
  command = ["hyprctl", "dispatch", "pin"]

  [[items.items]]
  label = "Close"
  icon = "󰅖"
  command = ["hyprctl", "dispatch", "killactive"]

  [[items.items]]
  label = "Workspace"
  icon = "󰕰"

    [[items.items.items]]
    label = "Previous"
    icon = "󰅁"
    command = ["hyprctl", "dispatch", "workspace", "e-1"]

    [[items.items.items]]
    label = "Empty"
    icon = "󰐕"
    command = ["hyprctl", "dispatch", "workspace", "empty"]

    [[items.items.items]]
    label = "Next"
    icon = "󰅂"
    command = ["hyprctl", "dispatch", "workspace", "e+1"]

[[items]]
label = "Power"
icon = "󰐥"

  [[items.items]]
  label = "Lock"
  icon = "󰌾"
  command = "hyprlock"
  fallback = ["swaylock -f", "loginctl lock-session"]

  [[items.items]]
  label = "Suspend"
  icon = "󰒲"
  command = ["systemctl", "suspend"]

  [[items.items]]
  label = "Log out"
  icon = "󰍃"
  command = ["hyprctl", "dispatch", "exit"]

  [[items.items]]
  label = "Reboot"
  icon = "󰜉"
  command = ["systemctl", "reboot"]

  [[items.items]]
  label = "Shut down"
  icon = "󰤂"
  command = ["systemctl", "poweroff"]

[[items]]
label = "Apps"
icon = "󰀻"
command = "fuzzel"
fallback = ["walker", "anyrun", "wofi --show drun", "rofi -show drun", "tofi-drun --drun-launch=true"]
